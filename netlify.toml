# BarberHQ — ruting og proxy.
# Rekkefølge er kritisk: første match vinner.

# Publish = kun site/. Selve siden (no/) bor der; alt annet på repo-roten
# (CLAUDE.md, tools/, .claude/, _utkast/, assets/, config) ligger UTENFOR publish og kan
# strukturelt ikke serveres. Dette er PRIMÆRVERNET mot lekkasje av interne filer.
# Bakgrunn: redirect-guards alene er IKKE vanntette — Netlifys fil-serving er
# case-INSENSITIV (serverer CLAUDE.md for /Claude.md, /CLAUDE.MD, …) mens redirect-`from`
# er case-SENSITIV, så case-varianter omgår enhver enumerert guard (empirisk bekreftet
# mot prod). Kun «ikke i publish» lukker hele klassen.
[build]
  publish = "site"
  # Hopp over bygget når ingenting som publiseres er endret siden forrige bygg (sparer credits:
  # en push med bare CLAUDE.md, tools/ eller _utkast/ skal ikke koste en deploy).
  # Netlify: exit 0 = hopp over, exit ≠ 0 = bygg. $CACHED_COMMIT_REF er forrige bygde commit.
  # netlify.toml er med fordi ruting/proxy/headere bor her. Mangler forrige ref (første bygg,
  # tømt cache), må det BYGGES: uten vakta ville `git diff --quiet "" HEAD` sammenlignet mot det
  # rene arbeidstreet, svart 0 og hoppet over. Ukjent ref gir exit 128 → bygg. Feil vei = bygg.
  ignore = "[ -n \"$CACHED_COMMIT_REF\" ] && git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- site/ netlify.toml"

# 0a. www → apex, 301, host-basert. Netlifys domene-config gjør allerede dette, men denne
#     regelen gjør det EKSPLISITT og portabelt (uavhengig av UI-innstillinger). Host-spesifikk
#     `from` → treffer KUN www-verten; apex-forespørsler hopper over den. Path bevares via :splat.
#     Først, så www konsolideres til apex før øvrige path-regler. http→https gjør Netlify selv.
[[redirects]]
  from = "https://www.trybarberhq.com/*"
  to = "https://trybarberhq.com/:splat"
  status = 301
  force = true

# 0. Guards på interne stier — SEKUNDÆRT nett bak publish=site (defense-in-depth,
#    fanger eksakt-case hvis publish-settingen noen gang skulle ryke). force = true
#    evalueres før statisk fil-serving → 404. Lowercase `/claude.md` er den funksjonelle
#    varianten (se case-notatet over); `/CLAUDE.md` er belte-og-seler.
[[redirects]]
  from = "/claude.md"
  to = "/no/"
  status = 404
  force = true

[[redirects]]
  from = "/CLAUDE.md"
  to = "/no/"
  status = 404
  force = true

[[redirects]]
  from = "/tools/*"
  to = "/no/"
  status = 404
  force = true

[[redirects]]
  from = "/.claude/*"
  to = "/no/"
  status = 404
  force = true

[[redirects]]
  from = "/_utkast/*"
  to = "/no/"
  status = 404
  force = true

# 1. Rot → /no/ for ALLE, uavhengig av Accept-Language. Markedet er NO, /no/ er master.
#    Språk-betinget ruting er FJERNET: Googlebot (uten norsk Accept-Language) traff før fallbacken
#    /en/ — utdatert copy + noindex — og fikk den indeksert, så norske søk landet der oversatt.
#    Nå går alle (inkl. bots) til /no/, som er kanonisk (se <link rel=canonical> i no/index.html).
#    301 (permanent, SEO 25.09): roten ble rapportert som «noindex» i Search Console (arv fra da
#    den språk-rutet til /en/). En 301 konsoliderer signaler til /no/ og dropper roten som egen
#    indekserbar URL. Ren server-redirect — ingen HTML-side, ingen JS/meta-refresh serveres på /.
[[redirects]]
  from = "/"
  to = "/no/"
  status = 301

# 2. /no uten trailing slash → katalog. Hindrer at /no fanges av proxy-regelen under.
[[redirects]]
  from = "/no"
  to = "/no/"
  status = 301

# 2b. sv/, da/ og en/ er SLETTET (23.10.2026): de var utdaterte v1-kopier (gammel layout-/palett-velger) som kunne
#     sende v1-felt til API-et. Gamle lenker og bokmerker får 301 til tilsvarende side i /no/. en/privacy.html het
#     personvern i no/. Må stå FØR /:slug-proxyen (ellers går /sv, /da, /en til backend som barber-slug).
[[redirects]]
  from = "/en/privacy.html"
  to = "/no/personvern.html"
  status = 301
  force = true

[[redirects]]
  from = "/en/privacy"
  to = "/no/personvern"
  status = 301
  force = true

[[redirects]]
  from = "/sv"
  to = "/no/"
  status = 301
  force = true

[[redirects]]
  from = "/sv/*"
  to = "/no/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/da"
  to = "/no/"
  status = 301
  force = true

[[redirects]]
  from = "/da/*"
  to = "/no/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/en"
  to = "/no/"
  status = 301
  force = true

[[redirects]]
  from = "/en/*"
  to = "/no/:splat"
  status = 301
  force = true

# 3. API- og book-proxy → Railway backend.
#    Må komme FØR /:slug-regelen — Netlify tar første treff.
[[redirects]]
  from = "/api/*"
  to = "https://api.trybarberhq.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/book/*"
  to = "https://api.trybarberhq.com/book/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/avmeld/*"
  to = "https://api.trybarberhq.com/avmeld/:splat"
  status = 200
  force = true

# 3a2. Kortlenke-ruta → backend (avmeldRouter). /a/<token> er den korte handlingslenka i utsendte
#      rebooking-SMS-er (GET viser + POST utfører). Uten denne treffer den Netlifys statiske 404 og
#      når aldri Railway — samme klasse som /images/*- og /verv/*-gapene. Må FØR /:slug (ett segment).
[[redirects]]
  from = "/a/*"
  to = "https://api.trybarberhq.com/a/:splat"
  status = 200
  force = true

# 3b. Bilde-råruta → backend. /api/dashboard/images returnerer url=/images/raw/<id> (flersegment),
#     som IKKE fanges av /:slug (ett segment) og ikke har noen lokal fil → 404 på dashboard-origin.
#     Uten denne proxyen laster crop-bildet og bildevelgerens galleri-thumbs aldri (verifisert:
#     backend-origin serverer /images/raw/<id> med 200, Netlify-origin ONERROR). Må FØR /:slug.
[[redirects]]
  from = "/images/*"
  to = "https://api.trybarberhq.com/images/:splat"
  status = 200
  force = true

# 3c. Kampanje-landingssider → backend. /verv/<slug> og /lojalitet/<slug> er nye offentlige backend-ruter;
#     uten disse treffer de Netlifys 404 og når aldri Railway (samme klasse som /images/*-gapet). Må FØR
#     /:slug — ellers sluker ett-segment-regelen dem ikke (de er to segmenter), men /verv alene ville.
[[redirects]]
  from = "/verv/*"
  to = "https://api.trybarberhq.com/verv/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/lojalitet/*"
  to = "https://api.trybarberhq.com/lojalitet/:splat"
  status = 200
  force = true

# 4. Proxy: ett-segment-stier → backend (barbersider).
#    :slug matcher kun ett segment — /no/priser (to segmenter) fanges aldri.
#    Status 200 = rewrite/proxy, URL forblir trybarberhq.com i adressefeltet.
#    force = false (default): eksisterende filer i publish-dir serves direkte.
[[redirects]]
  from = "/:slug"
  to = "https://api.trybarberhq.com/:slug"
  status = 200
  force = false

# 6. noindex på interne stier — belte-og-seler bak guardene i seksjon 0.
#    Hvis en guard-regel ryker ved en senere netlify.toml-endring og fila serveres
#    med 200, sikrer denne headeren at søkemotorer ikke indekserer den likevel.
#    /claude.md i lowercase (samme case-felle som guarden — se seksjon 0).
[[headers]]
  for = "/claude.md"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/CLAUDE.md"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/tools/*"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/.claude/*"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/_utkast/*"
  [headers.values]
    X-Robots-Tag = "noindex"

# 7. noindex på interne /no/-sider som ikke skal i søk (SEO 25.09). dashboard.html har
#    ingen robots-meta.
#    logg-inn/opprett-passord har allerede robots-meta i HTML-en. Header dekker begge former
#    (med og uten .html) belte-og-seler.
[[headers]]
  for = "/no/dashboard.html"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/no/dashboard"
  [headers.values]
    X-Robots-Tag = "noindex"

